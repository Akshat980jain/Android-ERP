name: Android Build (EAS)

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: EAS Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: android/package-lock.json

      - name: Setup Expo CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      # Preview build for beta tags (e.g., v1.2.0-beta)
      - name: Build Preview APK
        if: contains(github.ref_name, 'beta')
        run: eas build --platform android --profile preview --non-interactive

      # Production build for release tags (e.g., v1.2.0)
      - name: Build Production AAB
        if: "!contains(github.ref_name, 'beta')"
        run: eas build --platform android --profile production --non-interactive

      - name: Build Summary
        run: |
          echo "## 📱 Android Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Tag** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Profile** | ${{ contains(github.ref_name, 'beta') && 'preview (APK)' || 'production (AAB)' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Platform** | Android |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check [Expo Dashboard](https://expo.dev) for build artifacts." >> $GITHUB_STEP_SUMMARY
