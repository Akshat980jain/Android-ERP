name: Deploy to Render

on:
  push:
    branches: [main]

# Only run after CI passes
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Wait for CI to pass first
  ci-check:
    name: Verify CI
    uses: ./.github/workflows/ci.yml

  # ─── Deploy Frontend ───
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: ci-check
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render Deploy — Frontend
        run: |
          echo "🚀 Deploying Frontend to Render..."
          curl -s -o /dev/null -w "%{http_code}" "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}"
          echo ""
          echo "✅ Frontend deploy triggered!"

  # ─── Deploy Backend ───
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: ci-check
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render Deploy — Backend
        run: |
          echo "🚀 Deploying Backend to Render..."
          curl -s -o /dev/null -w "%{http_code}" "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"
          echo ""
          echo "✅ Backend deploy triggered!"

  # ─── Build Android APK after successful deploy ───
  build-android:
    name: Build Android (EAS)
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-backend]
    if: needs.deploy-frontend.result == 'success' && needs.deploy-backend.result == 'success'
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: android/package-lock.json

      - name: Setup Expo CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Type-check (warnings only)
        run: npx tsc --noEmit --skipLibCheck
        continue-on-error: true

      - name: Build Preview APK
        run: eas build --platform android --profile preview --non-interactive

  # ─── Post-deploy notification ───
  notify:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-backend, build-android]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ needs.deploy-frontend.result == 'success' && '✅ Deployed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | ${{ needs.deploy-backend.result == 'success' && '✅ Deployed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Android APK | ${{ needs.build-android.result == 'success' && '✅ Built' || needs.build-android.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
